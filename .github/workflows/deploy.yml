name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: orbit-campaign-nabi
  ACR_LOGIN_SERVER: crorbitplatform.azurecr.io
  ACR_USERNAME: ${{ vars.ACR_USERNAME }}
  ACR_PASSWORD: ${{ vars.ACR_PASSWORD }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate ACR inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ACR_USERNAME" || { echo "ACR_USERNAME repo variable is missing"; exit 1; }
          test -n "$ACR_PASSWORD" || { echo "ACR_PASSWORD repo variable is missing"; exit 1; }
          echo "ACR inputs present"

      - name: Docker login to ACR
        shell: bash
        run: |
          set -euo pipefail
          echo "$ACR_PASSWORD" | docker login "$ACR_LOGIN_SERVER" --username "$ACR_USERNAME" --password-stdin

      - name: Build and push image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="$ACR_LOGIN_SERVER/$IMAGE_NAME:$GITHUB_SHA"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "Image pushed: $IMAGE"

      - name: Build summary
        run: |
          echo "image=$ACR_LOGIN_SERVER/$IMAGE_NAME:$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
