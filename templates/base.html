<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ campaign.name | default('Console campagne') }} · Orbit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', path='css/orbit-v5.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/console.css') }}">
</head>
<body data-campaign-id="{{ campaign_id | default('91b22035-842f-4290-8c31-9f0fa9f26de5') }}">
  <main id="orbit-console-root">
    {% block content %}{% endblock %}
  </main>
  <div class="orbit-toast-region" id="orbit-toast-region" aria-live="polite" aria-relevant="additions"></div>
  {% block scripts %}{% endblock %}
</body>
</html>
